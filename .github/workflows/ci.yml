name: CI — Build All Frontends

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-shared-ui:
    name: Build shared-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "20",
            cache: "npm",
            cache-dependency-path: shared-ui/package-lock.json,
          }
      - run: cd shared-ui && npm ci && npm run build

  build-mfe-tasks:
    name: Build mfe-tasks
    runs-on: ubuntu-latest
    needs: build-shared-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "20",
            cache: "npm",
            cache-dependency-path: mfe-tasks/package-lock.json,
          }
      - run: cd mfe-tasks && npm ci && npm run build

  build-mfe-dashboard:
    name: Build mfe-dashboard
    runs-on: ubuntu-latest
    needs: build-shared-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "20",
            cache: "npm",
            cache-dependency-path: mfe-dashboard/package-lock.json,
          }
      - run: cd mfe-dashboard && npm ci && npm run build

  build-shell:
    name: Build shell-app
    runs-on: ubuntu-latest
    needs: [build-mfe-tasks, build-mfe-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "20",
            cache: "npm",
            cache-dependency-path: shell-app/package-lock.json,
          }
      - run: cd shell-app && npm ci && npm run build
